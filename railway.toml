[build]
builder = "dockerfile"

[deploy]
# the app connects to Neo4j + Pinecone and runs checkpointer.setup() at import,
# so give the first boot room before healthchecks start failing
startCommand = "uvicorn backend.backend:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
