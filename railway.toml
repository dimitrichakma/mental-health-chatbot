[build]
builder = "dockerfile"
# only rebuild the backend when something it actually ships changes
# (frontend-only / docs-only pushes are skipped)
watchPatterns = [
  "src/**",
  "backend/**",
  "Dockerfile",
  ".dockerignore",
  "pyproject.toml",
  "uv.lock",
  "railway.toml",
]

[deploy]
# the app connects to Neo4j + Pinecone and runs checkpointer.setup() at import,
# so give the first boot room before healthchecks start failing
startCommand = "uvicorn backend.backend:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
