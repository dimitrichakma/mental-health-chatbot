[project]
name = "mental-health-chatbot"
version = "0.1.0"
description = "A CBT / mental-health chatbot with hybrid graph + vector retrieval, a corrective-retrieval router, LangGraph agent, and a live web-search fallback."
readme = "README.md"
requires-python = ">=3.13"

# backend runtime only — this is what the deployed image installs
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "slowapi>=0.1.9",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langchain-anthropic>=1.7.1",
    "langchain-core>=1.6.2",
    "langchain-neo4j>=0.10.0",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.12.0",
    "pydantic>=2.13.5",
    "pinecone>=10.0.0",
    "voyageai>=0.5.0",
    "tavily-python>=0.8.1",
    "psycopg[binary]>=3.3.5",
    "psycopg-pool>=3.3.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
frontend = ["streamlit>=1.63.0", "requests>=2.34.2"]
dataprep = ["pandas>=3.0.5", "langchain-experimental>=0.4.2"]
# offline evaluation only (ragas_eval.py). Heavy transitive tree - kept out of
# default-groups so the deployed image never sees it.
eval = ["ragas>=0.4.3", "langchain-voyageai>=0.1.6"]

[tool.uv]
package = false
default-groups = ["frontend", "dataprep"]
